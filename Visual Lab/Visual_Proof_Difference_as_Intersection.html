<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Proof: Difference as Intersection</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]}};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f8fafc;color:#1e293b}.shell{max-width:1200px;margin:auto;background:white;padding:24px;border-radius:12px}.tab{padding:10px 16px;border-bottom:3px solid transparent;color:#64748b;font-weight:700;cursor:pointer}.tab.active{color:#4f46e5;border-bottom-color:#4f46e5}.btn{padding:9px 15px;border-radius:8px;font-weight:700}.primary{background:#4f46e5;color:#fff}.secondary{background:#e2e8f0;color:#334155}.step{opacity:.5;border-left:4px solid transparent;padding:12px;border-radius:8px}.step.active{opacity:1;background:#eff6ff;border-left-color:#3b82f6}.shape{transition:fill-opacity .5s ease}.stage{background-image:radial-gradient(#e2e8f0 1px,transparent 1px);background-size:22px 22px;border:2px solid #cbd5e1;border-radius:10px;position:relative;overflow:hidden}#tip{position:absolute;display:none;background:#0f172a;color:white;padding:8px 10px;border-radius:8px;font-size:12px;pointer-events:none;z-index:10}
</style>
</head>
<body class="p-4 md:p-6">
<div class="shell">
<h1 class="text-3xl font-bold text-center mb-2">Difference as Intersection</h1>
<p class="text-center text-slate-500 mb-5">Visual proof of $A-B=A\cap B'$</p>
<div class="bg-indigo-50 border border-indigo-200 rounded-lg p-4 text-center text-xl font-bold mb-5">$$A-B=A\cap B'$$</div>
<div class="flex justify-center flex-wrap border-b mb-5">
<div id="t1" class="tab active">1. LHS: $A-B$</div>
<div id="t2" class="tab">2. RHS: $A\cap B'$</div>
<div id="t3" class="tab">3. Equivalence</div>
</div>
<div id="controls" class="bg-slate-50 border rounded-lg p-4 mb-5 flex flex-col md:flex-row justify-between items-center gap-3">
<div id="desc" class="font-semibold text-slate-600">Constructing the Left-Hand Side</div>
<div class="flex items-center gap-2 flex-wrap justify-center"><span class="font-semibold">Step:</span><span id="stepNo" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded">0 / 2</span><button id="play" class="btn primary">▶ Auto-Play</button><button id="next" class="btn secondary">Next →</button><button id="reset" class="btn secondary">↻</button></div>
</div>
<div class="grid grid-cols-1 lg:grid-cols-5 gap-5">
<div class="lg:col-span-3 stage min-h-[470px] flex items-center justify-center" id="stage">
<div id="tip"></div>
<svg id="single" viewBox="0 0 800 500" class="w-full">
<defs>
<mask id="outsideB"><rect x="50" y="50" width="700" height="400" fill="white"/><circle cx="500" cy="250" r="145" fill="black"/></mask>
<clipPath id="clipOutsideB"><rect x="50" y="50" width="700" height="400"/></clipPath>
</defs>
<rect x="50" y="50" width="700" height="400" fill="#f8fafc" stroke="#64748b" stroke-width="3" rx="8"/>
<text x="65" y="80" font-size="24" font-weight="700">U</text>
<g id="lhsLayer">
<circle id="lhsA" class="shape" cx="320" cy="250" r="150" fill="#60a5fa" fill-opacity="0"/>
<circle id="lhsFinal" class="shape" cx="320" cy="250" r="150" fill="#8b5cf6" fill-opacity="0" mask="url(#outsideB)"/>
</g>
<g id="rhsLayer" style="display:none">
<rect id="rhsBc" class="shape" x="50" y="50" width="700" height="400" fill="#34d399" fill-opacity="0" mask="url(#outsideB)"/>
<circle id="rhsFinal" class="shape" cx="320" cy="250" r="150" fill="#8b5cf6" fill-opacity="0" mask="url(#outsideB)"/>
</g>
<circle cx="320" cy="250" r="150" fill="none" stroke="#334155" stroke-width="3"/>
<circle cx="500" cy="250" r="145" fill="none" stroke="#334155" stroke-width="3"/>
<text x="210" y="250" font-size="30" font-weight="700">A</text><text x="590" y="250" font-size="30" font-weight="700">B</text>
<rect id="hit" x="50" y="50" width="700" height="400" fill="transparent"/>
</svg>
<div id="dual" class="hidden w-full p-4 flex-col md:flex-row items-center gap-4">
<div class="flex-1 text-center"><div class="font-bold text-indigo-700 mb-2">$A-B$</div><svg viewBox="0 0 500 350" class="w-full border rounded bg-white"><defs><mask id="m1"><rect width="500" height="350" fill="white"/><circle cx="315" cy="175" r="100" fill="black"/></mask></defs><rect x="10" y="10" width="480" height="330" fill="#f8fafc"/><circle cx="190" cy="175" r="105" fill="#8b5cf6" fill-opacity=".8" mask="url(#m1)"/><circle cx="190" cy="175" r="105" fill="none" stroke="#1e293b" stroke-width="3"/><circle cx="315" cy="175" r="100" fill="none" stroke="#1e293b" stroke-width="3"/><text x="120" y="175" font-size="24" font-weight="700">A</text><text x="370" y="175" font-size="24" font-weight="700">B</text></svg></div>
<div class="text-4xl text-slate-400 font-bold">≡</div>
<div class="flex-1 text-center"><div class="font-bold text-emerald-700 mb-2">$A\cap B'$</div><svg viewBox="0 0 500 350" class="w-full border rounded bg-white"><defs><mask id="m2"><rect width="500" height="350" fill="white"/><circle cx="315" cy="175" r="100" fill="black"/></mask></defs><rect x="10" y="10" width="480" height="330" fill="#f8fafc"/><circle cx="190" cy="175" r="105" fill="#8b5cf6" fill-opacity=".8" mask="url(#m2)"/><circle cx="190" cy="175" r="105" fill="none" stroke="#1e293b" stroke-width="3"/><circle cx="315" cy="175" r="100" fill="none" stroke="#1e293b" stroke-width="3"/><text x="120" y="175" font-size="24" font-weight="700">A</text><text x="370" y="175" font-size="24" font-weight="700">B</text></svg></div>
</div>
</div>
<div class="lg:col-span-2 flex flex-col gap-4"><div class="border rounded-xl p-4"><h2 id="ledgerTitle" class="font-bold text-lg border-b pb-2 mb-3">LHS Progression</h2><div id="ledger"></div></div><div id="status" class="bg-indigo-50 border border-indigo-200 rounded-xl p-4 text-center text-sm font-medium">Press <strong>Play</strong> or <strong>Next</strong> to begin.</div></div>
</div>
</div>
<script>
(()=>{if(window.__diffVisInit)return;window.__diffVisInit=true;
const S={mode:1,step:0,max:2,playing:false,timer:null,start:null};
const $=id=>document.getElementById(id);const D={tabs:[$('t1'),$('t2'),$('t3')],controls:$('controls'),desc:$('desc'),stepNo:$('stepNo'),play:$('play'),next:$('next'),reset:$('reset'),single:$('single'),dual:$('dual'),lhs:$('lhsLayer'),rhs:$('rhsLayer'),lhsA:$('lhsA'),lhsFinal:$('lhsFinal'),rhsBc:$('rhsBc'),rhsFinal:$('rhsFinal'),ledger:$('ledger'),ledgerTitle:$('ledgerTitle'),status:$('status'),hit:$('hit'),tip:$('tip')};
const walks={
1:{title:'LHS Progression',desc:'Constructing the Left-Hand Side: $A-B$',max:2,steps:[
['1. Start with $A$ and $B$','We want $A-B$: all elements that are in $A$ but not in $B$.'],
['2. Begin with all of $A$','Start with the whole set $A$.'],
['3. Remove the part inside $B$','Delete the overlap with $B$. What remains is the part of $A$ outside $B$.']
]},
2:{title:'RHS Progression',desc:"Constructing the Right-Hand Side: $A\\cap B'$",max:2,steps:[
['1. Start with $A$ and $B$','Now build the right-hand side independently.'],
["2. Find $B'$","$B'$ is everything in the universal set that is not in $B$."],
["3. Intersect with $A$","Keep only the part that is in both $A$ and $B'$. This is exactly the part of $A$ outside $B$."]
]}};
function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise().catch(()=>{});}function op(el,v){el.setAttribute('fill-opacity',v)}
function pause(){S.playing=false;clearTimeout(S.start);clearInterval(S.timer);D.play.innerHTML='▶ Auto-Play';D.play.className='btn primary'}
function visuals(){op(D.lhsA,0);op(D.lhsFinal,0);op(D.rhsBc,0);op(D.rhsFinal,0);if(S.mode===1){if(S.step===1)op(D.lhsA,.38);if(S.step===2)op(D.lhsFinal,.82)}else if(S.mode===2){if(S.step===1)op(D.rhsBc,.42);if(S.step===2)op(D.rhsFinal,.82)}}
function setStep(n){S.step=n;D.stepNo.textContent=`${n} / ${S.max}`;document.querySelectorAll('.step').forEach((el,i)=>el.classList.toggle('active',i===n));visuals();D.status.innerHTML=walks[S.mode].steps[n][1];D.next.disabled=n>=S.max;typeset()}
function setMode(m){pause();S.mode=m;D.tabs.forEach((t,i)=>t.classList.toggle('active',i===m-1));if(m===3){D.controls.style.display='none';D.single.style.display='none';D.dual.classList.remove('hidden');D.dual.classList.add('flex');D.ledgerTitle.textContent='Equivalence Achieved';D.ledger.innerHTML='<div class="step active"><strong>Visual conclusion</strong><br><span class="text-sm">On the left, $A-B$ means: start with $A$ and remove every point that lies in $B$.<br><br>On the right, $A\\cap B\\prime$ means: keep points that are in $A$ and also outside $B$.<br><br>Both descriptions select exactly the same region.</span></div><div class="step active"><strong>Key idea</strong><br><span class="text-sm">“In $A$ but not in $B$” and “in both $A$ and $B\\prime$” say the same thing.</span></div>';D.status.innerHTML='<strong>Result:</strong> $A-B=A\\cap B\\prime$';typeset();return}D.controls.style.display='flex';D.single.style.display='block';D.dual.classList.add('hidden');D.dual.classList.remove('flex');D.lhs.style.display=m===1?'block':'none';D.rhs.style.display=m===2?'block':'none';const w=walks[m];S.max=w.max;D.desc.innerHTML=w.desc;D.ledgerTitle.textContent=w.title;D.ledger.innerHTML=w.steps.map((s,i)=>`<div class="step ${i===0?'active':''}"><strong>${s[0]}</strong><br><span class="text-sm">${s[1]}</span></div>`).join('');setStep(0);typeset()}
function next(){if(S.step<S.max)setStep(S.step+1);else pause()}function play(){if(S.playing){pause();return}if(S.step>=S.max)setStep(0);S.playing=true;D.play.innerHTML='⏸ Pause';D.play.className='btn secondary';S.start=setTimeout(()=>{if(S.playing)next()},700);S.timer=setInterval(()=>{if(S.step>=S.max)pause();else next()},2400)}
D.tabs.forEach((t,i)=>t.addEventListener('click',()=>setMode(i+1)));D.next.addEventListener('click',next);D.play.addEventListener('click',play);D.reset.addEventListener('click',()=>{pause();setStep(0)});
D.hit.addEventListener('mousemove',e=>{const p=D.single.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(D.single.getScreenCTM().inverse());const a=Math.hypot(q.x-320,q.y-250)<150,b=Math.hypot(q.x-500,q.y-250)<145;let txt='Outside both sets';if(a&&b)txt='A ∩ B: in both A and B';else if(a&&!b)txt='A − B: in A, not in B';else if(!a&&b)txt='B only: in B, not in A';D.tip.textContent=txt;D.tip.style.display='block';D.tip.style.left=(e.offsetX+12)+'px';D.tip.style.top=(e.offsetY+12)+'px'});D.hit.addEventListener('mouseleave',()=>D.tip.style.display='none');setMode(1);
})();
</script>
</body></html>
